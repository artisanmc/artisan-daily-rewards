schema: menu/v1
# /daily: the days as they went (claimed, waiting to be claimed, missed), today, then the days to
# come with the reward each one pays if the player comes every day, 28 a page (the arrows at the
# bottom). Rows of 7 laid out as the Rewards grid (week: "7"): today sits on the column of its day
# of the cycle, days 7, 14, 21 and 28 on the last one; the first page starts 7 to 13 days back. A day the player was there counts for the streak, claimed or not: its reward waits. The rewards are those of
# data/rewards (days, else default_day): edit them in the Rewards screen. A day that reaches a
# milestone of the streak (milestones of data/rewards) glows and says so; the button at the bottom
# left opens the milestones menu,
# only when data/rewards has milestones.
# Each state of a day has its own item, to tell them apart at a glance: a reward to claim is a
# glowing lime dye, a claimed day a gray dye, a missed day a red dye, a day a freeze covered a light blue dye, a day before the first one
# counted a light gray pane, and a day to come shows the reward it will pay. Change the material
# of a state below to change its look.
title:
  - kind: plain
    value: { en: "<dark_gray>Daily rewards", fr: "<dark_gray>Récompenses quotidiennes" }
size: 54
inputs:
  - name: status
    type: list
    source: { ref: "daily:status" }
  - name: days
    type: list
    source:
      ref: "daily:calendar"
      params: { past: "7", future: "104", week: "7" }
elements:
  - id: border
    positions: "0-3,5-8,9,17,18,26,27,35,36,44,46,51,52"
    material: GRAY_STAINED_GLASS_PANE
    title: " "
  - id: streak
    positions: 4
    material: NETHER_STAR
    title: { en: "<gold>Streak: <white>{status[0].streak}", fr: "<gold>Streak : <white>{status[0].streak}" }
    lore:
      - { en: "<gray>Longest: <white>{status[0].longest}", fr: "<gray>Record : <white>{status[0].longest}" }
      - { en: "<gray>Days: <white>{status[0].total}", fr: "<gray>Jours : <white>{status[0].total}" }
      - { en: "<gray>Day <white>{status[0].cycle_day}</white> of <white>{status[0].cycle_length}</white>", fr: "<gray>Jour <white>{status[0].cycle_day}</white> sur <white>{status[0].cycle_length}</white>" }
      - ""
      - { en: "{status[0].at_risk ? \"<yellow>Play today or your streak ends\" : \"\"}{status[0].broken ? \"<red>Your streak starts again today\" : \"\"}", fr: "{status[0].at_risk ? \"<yellow>Joue aujourd'hui ou ton streak s'arrête\" : \"\"}{status[0].broken ? \"<red>Ton streak repart de zéro aujourd'hui\" : \"\"}" }
  - id: days
    positions: "10-16,19-25,28-34,37-43"
    iterates: { source: days, alias: d }
    states:
      # Today, waiting: a glowing lime dye, a click claims it (with any day before still waiting).
      - if:
          - expression: d.is_available
          - expression: d.is_today
        material: LIME_DYE
        enchanted: true
        title: { en: "<green>Reward to claim", fr: "<green>Récompense à réclamer" }
        lore:
          - { en: "<yellow>Today <gray>· day {d.cycle_day}", fr: "<yellow>Aujourd'hui <gray>· jour {d.cycle_day}" }
          - { en: "{d.is_milestone ? \"<light_purple>+ streak bonus: \" + d.streak + \" days\" : \"\"}", fr: "{d.is_milestone ? \"<light_purple>+ bonus de streak : \" + d.streak + \" jours\" : \"\"}" }
          - { en: "<green>Click to claim", fr: "<green>Cliquer pour réclamer" }
        click:
          left:
            - module_command: { command: "daily:claim" }
      # A day before when the player was there without claiming: its reward still waits.
      - if:
          - expression: d.is_available
        material: LIME_DYE
        enchanted: true
        title: { en: "<green>Reward to claim", fr: "<green>Récompense à réclamer" }
        lore:
          - { en: "<yellow>{d.date} <gray>· day {d.cycle_day}", fr: "<yellow>{d.date} <gray>· jour {d.cycle_day}" }
          - { en: "<gray>You were there: not claimed yet", fr: "<gray>Tu étais là : pas encore réclamée" }
          - { en: "{d.is_milestone ? \"<light_purple>+ streak bonus: \" + d.streak + \" days\" : \"\"}", fr: "{d.is_milestone ? \"<light_purple>+ bonus de streak : \" + d.streak + \" jours\" : \"\"}" }
          - { en: "<green>Click to claim", fr: "<green>Cliquer pour réclamer" }
        click:
          left:
            - module_command: { command: "daily:claim" }
      # Today, claimed: a gray dye.
      - if:
          - expression: d.is_today
        material: GRAY_DYE
        title: { en: "<gray>✔ Claimed", fr: "<gray>✔ Réclamée" }
        lore:
          - { en: "<yellow>Today <gray>· day {d.cycle_day}", fr: "<yellow>Aujourd'hui <gray>· jour {d.cycle_day}" }
          - { en: "<gray>Next reward in <white>{status[0].until_reset}", fr: "<gray>Prochaine récompense dans <white>{status[0].until_reset}" }
          - { en: "{d.is_milestone ? \"<light_purple>+ streak bonus: \" + d.streak + \" days\" : \"\"}", fr: "{d.is_milestone ? \"<light_purple>+ bonus de streak : \" + d.streak + \" jours\" : \"\"}" }
      # A day before, claimed: a gray dye.
      - if:
          - expression: d.is_claimed
        material: GRAY_DYE
        title: { en: "<gray>✔ Claimed", fr: "<gray>✔ Réclamée" }
        lore:
          - { en: "<gray>{d.date} · day {d.cycle_day}", fr: "<gray>{d.date} · jour {d.cycle_day}" }
          - { en: "{d.is_milestone ? \"<light_purple>+ streak bonus: \" + d.streak + \" days\" : \"\"}", fr: "{d.is_milestone ? \"<light_purple>+ bonus de streak : \" + d.streak + \" jours\" : \"\"}" }
      # Missed, but a freeze kept the streak: the rewards paused that day (the next one came the day after).
      - if:
          - expression: d.is_covered
        material: LIGHT_BLUE_DYE
        title: { en: "<aqua>✚ Freeze used", fr: "<aqua>✚ Gel utilisé" }
        lore:
          - { en: "<gray>{d.date}: you were not there", fr: "<gray>{d.date} : tu n'étais pas là" }
          - { en: "<gray>A freeze saved your streak.", fr: "<gray>Un gel a sauvé ton streak." }
          - { en: "<gray>The rewards paused for a day:", fr: "<gray>Les récompenses ont fait une pause :" }
          - { en: "<gray>none was lost.", fr: "<gray>aucune n'est perdue." }
      - if:
          - expression: d.is_missed
        material: RED_DYE
        title: { en: "<red>✘ Missed", fr: "<red>✘ Manquée" }
        lore:
          - { en: "<gray>{d.date}: you were not there", fr: "<gray>{d.date} : tu n'étais pas là" }
      - if:
          - expression: d.is_before
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        title: { en: "<gray>{d.date}", fr: "<gray>{d.date}" }
      # A day to come that reaches a milestone: its icon glows.
      - if:
          - expression: d.is_milestone
        item: "{d.milestone_icon}"
        enchanted: true
        lore:
          - ""
          - { en: "<gray>On {d.date} <dark_gray>· day {d.cycle_day}", fr: "<gray>Le {d.date} <dark_gray>· jour {d.cycle_day}" }
          - { en: "<light_purple>+ streak bonus: {d.streak} days", fr: "<light_purple>+ bonus de streak : {d.streak} jours" }
          - { en: "<dark_gray>If you come every day until then", fr: "<dark_gray>Si tu viens chaque jour d'ici là" }
    # A day to come.
    item: "{d.icon}"
    lore:
      - ""
      - { en: "<gray>On {d.date} <dark_gray>· day {d.cycle_day}", fr: "<gray>Le {d.date} <dark_gray>· jour {d.cycle_day}" }
      - { en: "<dark_gray>If you come every day until then", fr: "<dark_gray>Si tu viens chaque jour d'ici là" }
  - id: freezes
    positions: 45
    material: TOTEM_OF_UNDYING
    title: { en: "<aqua>Freezes: <white>{status[0].freezes}/{status[0].freeze_max}", fr: "<aqua>Gels : <white>{status[0].freezes}/{status[0].freeze_max}" }
    lore:
      - { en: "<gray>A freeze covers one missed day:", fr: "<gray>Un gel couvre un jour manqué :" }
      - { en: "<gray>your streak is kept but does not grow.", fr: "<gray>ton streak est gardé mais n'augmente pas." }
      - { en: "<gray>More days missed than freezes:", fr: "<gray>Plus de jours manqués que de gels :" }
      - { en: "<gray>your streak starts over.", fr: "<gray>ton streak repart de zéro." }
      - { en: "<gray>The rewards pause, none is lost.", fr: "<gray>Les récompenses font une pause, aucune n'est perdue." }
      - ""
      # The countdown to the next freeze earned: hidden when none will be (stock full, or never earned).
      - { en: "{status[0].next_freeze_in > 1 ? \"<aqua>Next freeze in <white>\" + status[0].next_freeze_in + \"</white> days of streak\" : \"\"}", fr: "{status[0].next_freeze_in > 1 ? \"<aqua>Prochain gel dans <white>\" + status[0].next_freeze_in + \"</white> jours de streak\" : \"\"}" }
      - { en: "{status[0].next_freeze_in == 1 ? \"<aqua>Next freeze tomorrow\" : \"\"}", fr: "{status[0].next_freeze_in == 1 ? \"<aqua>Prochain gel demain\" : \"\"}" }
      - { en: "{status[0].next_freeze_in == 0 ? \"<aqua>Next freeze today\" : \"\"}", fr: "{status[0].next_freeze_in == 0 ? \"<aqua>Prochain gel aujourd'hui\" : \"\"}" }
      - { en: "{status[0].freeze_max > 0 && status[0].freezes >= status[0].freeze_max ? \"<dark_gray>Stock full: none earned until one is used\" : \"\"}", fr: "{status[0].freeze_max > 0 && status[0].freezes >= status[0].freeze_max ? \"<dark_gray>Stock plein : aucun gagné avant d'en utiliser un\" : \"\"}" }
  - id: milestones
    positions: 47
    states:
      # No milestone in data/rewards: the border, no button.
      - if:
          - expression: "!status[0].has_milestones"
        material: GRAY_STAINED_GLASS_PANE
        title: " "
    material: BEACON
    title: { en: "<light_purple>Streak milestones", fr: "<light_purple>Paliers de streak" }
    lore:
      - { en: "{status[0].next_milestone > 0 ? \"<gray>Next: <white>\" + status[0].next_milestone + \" days</white> of streak\" : \"<gray>No milestone left\"}", fr: "{status[0].next_milestone > 0 ? \"<gray>Prochain : <white>\" + status[0].next_milestone + \" jours</white> de streak\" : \"<gray>Plus aucun palier\"}" }
      - { en: "{status[0].next_milestone_in == 0 ? \"<yellow>Today\" : \"\"}", fr: "{status[0].next_milestone_in == 0 ? \"<yellow>Aujourd'hui\" : \"\"}" }
      - { en: "{status[0].next_milestone_in > 0 ? \"<gray>In <white>\" + status[0].next_milestone_in + \"</white> days\" : \"\"}", fr: "{status[0].next_milestone_in > 0 ? \"<gray>Dans <white>\" + status[0].next_milestone_in + \"</white> jours\" : \"\"}" }
      - ""
      - { en: "<green>Click to see them all", fr: "<green>Cliquer pour tous les voir" }
    click: { left: [ { open_menu: "daily:milestones" } ] }
  - id: previous
    positions: 48
    states:
      - if:
          - pagination_at_first: days
        material: GRAY_STAINED_GLASS_PANE
        title: " "
    material: ARROW
    title: { en: "<yellow>Previous days", fr: "<yellow>Jours précédents" }
    click: { left: [ { pagination_prev: days } ] }
  - id: next
    positions: 50
    states:
      - if:
          - pagination_at_last: days
        material: GRAY_STAINED_GLASS_PANE
        title: " "
    material: ARROW
    title: { en: "<yellow>Next days", fr: "<yellow>Jours suivants" }
    click: { left: [ { pagination_next: days } ] }
  - id: claim
    positions: 49
    states:
      - if:
          - expression: status[0].can_claim
        material: SUNFLOWER
        enchanted: true
        title: { en: "<green>Claim your rewards", fr: "<green>Réclamer tes récompenses" }
        lore:
          - { en: "{status[0].unclaimed > 1 ? \"<gray>\" + status[0].unclaimed + \" rewards waiting\" : \"\"}", fr: "{status[0].unclaimed > 1 ? \"<gray>\" + status[0].unclaimed + \" récompenses en attente\" : \"\"}" }
        click:
          left:
            - module_command: { command: "daily:claim" }
      - if:
          - expression: status[0].claimed_today
        material: CLOCK
        title: { en: "<gray>Next reward in <white>{status[0].until_reset}", fr: "<gray>Prochaine récompense dans <white>{status[0].until_reset}" }
    material: CLOCK
    title: { en: "<gray>Loading…", fr: "<gray>Chargement…" }
  - id: close
    positions: 53
    material: BARRIER
    title: { en: "<red>Close", fr: "<red>Fermer" }
    click: { left: [ close_menu ] }
