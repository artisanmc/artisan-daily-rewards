# The reward cycle: edited in the Artisan editor (the daily folder, Rewards).
# Days before the rewards start again at day 1.
cycle_length: 28
# The reward of a day of the cycle not listed under days.
default_day:
  icon:
    material: BREAD
    count: 8
    title: { en: "<white>8 bread", fr: "<white>8 pains" }
  actions:
    - give_item: { material: BREAD, count: 8 }
# Keyed by the day of the cycle, 1 to cycle_length.
days:
  7:
    icon:
      material: IRON_INGOT
      count: 8
      title: { en: "<white>8 iron ingots", fr: "<white>8 lingots de fer" }
    actions:
      - give_item: { material: IRON_INGOT, count: 8 }
  14:
    icon:
      material: GOLD_INGOT
      count: 8
      title: { en: "<gold>8 gold ingots", fr: "<gold>8 lingots d'or" }
    actions:
      - give_item: { material: GOLD_INGOT, count: 8 }
  21:
    icon:
      material: EMERALD
      count: 6
      title: { en: "<green>6 emeralds", fr: "<green>6 émeraudes" }
    actions:
      - give_item: { material: EMERALD, count: 6 }
  28:
    icon:
      material: DIAMOND
      count: 3
      title: { en: "<aqua>3 diamonds", fr: "<aqua>3 diamants" }
    actions:
      - give_item: { material: DIAMOND, count: 3 }
# Bonuses of the streak, paid on top of the day's reward: at (once per streak) or every (again and
# again, from "from", by default every). Everything a day reaches is paid. A break starts the
# streak again, and its milestones with it: end with an every milestone, so that going on always
# pays more than starting over.
milestones:
  - at: 30
    icon:
      material: ENCHANTED_GOLDEN_APPLE
      title: { en: "<light_purple>30-day streak: an enchanted golden apple", fr: "<light_purple>Streak de 30 jours : une pomme dorée enchantée" }
    actions:
      - give_item: { material: ENCHANTED_GOLDEN_APPLE, count: 1 }
  - every: 50
    icon:
      material: NETHERITE_INGOT
      title: { en: "<dark_purple>Every 50 days of streak: a netherite ingot", fr: "<dark_purple>Tous les 50 jours de streak : un lingot de netherite" }
    actions:
      - give_item: { material: NETHERITE_INGOT, count: 1 }
