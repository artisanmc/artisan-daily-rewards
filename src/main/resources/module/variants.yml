schema: variants/v1
# The variants this module has versions for, in variants/<name>/. Which one a player sees is the
# server's: 'textured' redraws the calendar and the milestones with the images of
# assets/textures/daily_*, for Java players who loaded the server's resource pack. Everyone else
# (no pack, Bedrock) keeps the module's menus, unless they chose otherwise with /artisan variant.
variants: [textured]
