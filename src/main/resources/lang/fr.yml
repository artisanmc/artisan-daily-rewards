# Messages d'ArtisanDailyRewards (MiniMessage). Surcharge une clé dans plugins/Artisan/modules/daily/lang/fr.yml.
reminder: "<gold>Ta récompense du jour t'attend !</gold> <click:run_command:/daily claim><hover:show_text:'<gray>La réclamer'><green>[Réclamer]</green></hover></click>"
