name: Release

# A tag v<version> builds the jar, then Artisan's shared sign-release.yml signs it with the
# organization secret ARTISAN_SIGNING_KEY and publishes it with release.json on this
# repository's Release. Artisan's updater downloads both and checks the signature against
# the public key it pins.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Artisan's add-on API is not on repo.artisanmc.net yet past 1.7: built from Artisan's
      # sources at the version gradle.properties names, into mavenLocal.
      - name: Artisan API
        run: |
          api=$(sed -n 's/^artisanApiVersion=//p' gradle.properties)
          git clone --depth 1 --branch v2 https://github.com/artisanmc/artisan.git "$RUNNER_TEMP/artisan"
          (cd "$RUNNER_TEMP/artisan/plugin" && ./gradlew :artisan-api:publishCoreApiPublicationToMavenLocal -PapiVersion="$api" --no-daemon)
      - run: ./gradlew test jar -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    uses: artisanmc/artisan/.github/workflows/sign-release.yml@v2
    secrets: inherit
