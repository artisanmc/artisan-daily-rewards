plugins {
    id 'java'
}

group = 'com.github.ibanetchep'
version = '1.0.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.artisanmc.net/releases' }
}

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
    // Artisan — a required dependency, provided at runtime by the Artisan plugin, never shaded.
    compileOnly("net.artisanmc:artisan-core-api:${artisanApiVersion}")

    testImplementation('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
    testImplementation("net.artisanmc:artisan-core-api:${artisanApiVersion}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.12.1')
    testImplementation('com.h2database:h2:2.3.232')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events('failed')
        exceptionFormat = 'full'
    }
}

jar {
    archiveFileName = "ArtisanDailyRewards-${version}.jar"
}
